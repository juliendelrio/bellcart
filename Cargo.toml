[package]
name = "bellcart"
version = "0.0.1"
edition = "2024"
license-file = "LICENSE.md"
description = "Pack your old PC. Leave the junk behind. A migration assistant that decides what is worth moving."
repository = "https://github.com/juliendelrio/bellcart"
readme = "README.md"
keywords = ["migration", "windows", "backup", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "/src",
    "/tests",
    "/packs",
    "/locales",
    "/schemas",
    "/web",
    "/README.md",
    "/LICENSE.md",
    "/LICENSE_EE.md",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
fluent-bundle = "0.16"
globset = "0.4"
include_dir = "0.7"
rayon = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
unic-langid = "0.9"
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }

[lints.rust]
# Windows API calls will live in a dedicated member crate that opts out
# explicitly. Nothing in this package may use `unsafe`.
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
