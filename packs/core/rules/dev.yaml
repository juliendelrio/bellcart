# yaml-language-server: $schema=../../../schemas/rules.schema.json
#
# Developer folders that a build tool or a package manager recreates.
# Rules here must be safe on any machine: when a name alone is ambiguous,
# add `contains` so only the real thing matches.
rules:
  - id: node-modules
    decision: leave
    reason: regenerable-dependencies
    match:
      name_in: [node_modules]

  - id: python-venv
    decision: leave
    reason: regenerable-dependencies
    match:
      name_in: [venv, .venv, env]
      contains: [pyvenv.cfg]

  - id: python-bytecode
    decision: leave
    reason: build-output
    match:
      name_in: [__pycache__]

  - id: cargo-target
    decision: leave
    reason: build-output
    match:
      name_in: [target]
      contains: [CACHEDIR.TAG]

  # Next.js build output, rebuilt by `next build` or `next dev`.
  - id: nextjs-build
    decision: leave
    reason: build-output
    match:
      name_in: [.next]
      contains: [build-manifest.json]

  - id: maven-repository
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/.m2/repository"

  - id: gradle-caches
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/.gradle/caches"

  - id: nuget-packages
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/.nuget/packages"

  - id: cargo-registry
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/.cargo/registry"

  - id: cargo-git
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/.cargo/git"

  # `rustup` installs them again from `rust-toolchain` files and its
  # settings, which stay in `.rustup/settings.toml`.
  - id: rustup-toolchains
    decision: leave
    reason: regenerable-dependencies
    match:
      path_glob: "**/.rustup/toolchains"

  - id: pnpm-store
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/AppData/Local/pnpm/store"

  # Models downloaded by Hugging Face libraries, fetched again on first
  # use. A model someone trained is saved elsewhere, not in this cache.
  - id: huggingface-hub-cache
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/.cache/huggingface/hub"

  # The Go module cache: modules are downloaded again from go.mod files.
  # `cache` is where the go command keeps the downloads.
  - id: go-module-cache
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/go/pkg/mod"
      contains: [cache]

  - id: yarn-cache
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/AppData/Local/Yarn/Cache"

  - id: bun-cache
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/.bun/install/cache"

  # Gradle versions the wrapper downloads; `gradle-wrapper.properties` in
  # each project says which one to fetch again.
  - id: gradle-wrapper-dists
    decision: leave
    reason: regenerable-dependencies
    match:
      path_glob: "**/.gradle/wrapper/dists"

  # Indexes and caches of JetBrains IDEs, rebuilt when a project opens.
  # Settings are in AppData/Roaming/JetBrains, not here.
  - id: jetbrains-caches
    decision: leave
    reason: application-cache
    match:
      path_glob: "**/AppData/Local/JetBrains/*/caches"
