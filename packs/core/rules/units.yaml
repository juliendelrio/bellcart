# yaml-language-server: $schema=../../../schemas/rules.schema.json
#
# Folders Bellcart recognises but does not decide. Each one is judged
# whole, or cut one level (`parts`), with a reason that says what it is,
# instead of being cut by size into cards that mean little. Rules still
# apply inside them.
rules:
  # Application data: one card per application folder, never cut further.
  # Applications the pack knows (apps.yaml) have their own card with a
  # proposed decision; the unknown ones are judged by the user, and those
  # too small for a card of their own share one.
  - id: appdata-applications
    decision: review
    reason: other-applications
    parts: unknown-application
    match:
      path_glob: "**/AppData/{Local,LocalLow,Roaming}"

  # Folders that hold many applications of their own: Microsoft's, and the
  # data of Microsoft Store applications. Cut the same way, so a large one
  # has its own card and the small ones share the folder's.
  - id: appdata-shared-folders
    decision: review
    reason: other-applications
    parts: unknown-application
    match:
      path_glob: "**/AppData/Local/{Microsoft,Packages}"

  # Dot folders at the root of the profile: settings and data of
  # command-line tools and editors, like AppData. Each is judged whole;
  # one too small for a card of its own joins the profile's card. Known
  # ones (apps.yaml) and keys (credentials.yaml) are matched first.
  - id: root-dot-folders
    decision: review
    reason: tool-folder
    fold_small: true
    match:
      path_glob: ".*"
