# yaml-language-server: $schema=../../../schemas/rules.schema.json
#
# Folders Bellcart recognises but does not decide: each one becomes a
# single unit to review, with a reason that says what it is, instead of
# being cut into many cards. Rules still apply inside them.
rules:
  # Application data. Most of it comes back when the applications are
  # reinstalled, and the recipes pick out what does not (browser profiles,
  # editor settings, keys). But it can also hold the only copy of real data:
  # mail stores, game saves, virtual machine disks. So it is not decided:
  # it is one unit, instead of dozens of cards about application folders.
  - id: appdata
    decision: review
    reason: application-data
    match:
      path_glob: "**/AppData"
      contains: [Local, LocalLow, Roaming]
