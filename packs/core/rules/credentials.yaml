# yaml-language-server: $schema=../../../schemas/rules.schema.json
#
# Small, easy to forget, painful to lose.
rules:
  - id: ssh-keys
    decision: migrate
    reason: keys-and-credentials
    match:
      name_in: [.ssh]

  - id: gnupg-keys
    decision: migrate
    reason: keys-and-credentials
    match:
      name_in: [.gnupg]
