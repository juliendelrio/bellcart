# yaml-language-server: $schema=../../../schemas/rules.schema.json
#
# Caches and temporary files under a Windows user profile.
# Paths are relative to the scan root, so `**/` lets a rule match whether
# the user scans one profile, C:\Users or a whole drive.
rules:
  - id: user-temp
    decision: leave
    reason: temporary-files
    match:
      path_glob: "**/AppData/Local/Temp"

  - id: crash-dumps
    decision: leave
    reason: temporary-files
    match:
      path_glob: "**/AppData/Local/CrashDumps"

  - id: internet-cache
    decision: leave
    reason: application-cache
    match:
      path_glob: "**/AppData/Local/Microsoft/Windows/INetCache"

  - id: store-app-temp
    decision: leave
    reason: temporary-files
    match:
      path_glob: "**/AppData/Local/Packages/*/TempState"

  - id: npm-cache
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/AppData/Local/npm-cache"

  - id: pip-cache
    decision: leave
    reason: package-cache
    match:
      path_glob: "**/AppData/Local/pip/cache"

  - id: chromium-cache
    decision: leave
    reason: application-cache
    match:
      path_glob: "**/User Data/*/{Cache,Code Cache,GPUCache,DawnGraphiteCache,DawnWebGPUCache}"

  # Parts of Chrome and Edge that the browser downloads again: an on-device
  # model of several gigabytes, components, extension packages, shaders.
  - id: browser-components
    decision: leave
    reason: application-cache
    match:
      path_glob: "**/User Data/{OptGuideOnDeviceModel,optimization_guide_model_store,screen_ai,component_crx_cache,extensions_crx_cache,GrShaderCache,ShaderCache}"

  # Offline copies of web pages and scripts. Site data that may be the
  # user's own (IndexedDB, File System) is not matched and stays to review.
  - id: service-worker-cache
    decision: leave
    reason: application-cache
    match:
      path_glob: "**/{User Data/*,AppData/Roaming/*}/Service Worker/{CacheStorage,ScriptCache}"

  # Electron applications (Slack, VS Code, Teams...) keep a Chromium cache
  # in their Roaming folder. `Cache` is a common word, so the rule also
  # asks for the `Cache_Data` folder Chromium creates inside it.
  - id: electron-cache
    decision: leave
    reason: application-cache
    match:
      path_glob: "**/AppData/Roaming/*/Cache"
      contains: [Cache_Data]

  - id: electron-gpu-cache
    decision: leave
    reason: application-cache
    match:
      path_glob: "**/AppData/Roaming/*/{Code Cache,GPUCache,DawnGraphiteCache,DawnWebGPUCache}"

  # Reports the Chromium crash handler keeps for the application's
  # developers.
  - id: crash-reports
    decision: leave
    reason: crash-reports
    match:
      path_glob: "**/AppData/**/Crashpad"

  # Settings live in `Code/User` and are not matched.
  - id: vscode-caches
    decision: leave
    reason: application-cache
    match:
      path_glob: "**/AppData/Roaming/{Code,Code - Insiders,VSCodium,Cursor}/{CachedData,CachedExtensionVSIXs,CachedProfilesData,logs}"

  - id: firefox-cache
    decision: leave
    reason: application-cache
    match:
      path_glob: "**/AppData/Local/Mozilla/Firefox/Profiles/*/cache2"

  # Google Drive for desktop keeps its streamed files here. The files live
  # in the cloud and the client syncs them on its own, so the cache is
  # rebuilt on the new PC. Mirrored files are in a normal folder, not here.
  - id: google-drive-cache
    decision: leave
    reason: cloud-sync-cache
    match:
      path_glob: "**/AppData/Local/Google/DriveFS"
