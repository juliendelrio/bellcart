# yaml-language-server: $schema=../../../schemas/recipe.schema.json
id: microsoft-powertoys
name: Microsoft PowerToys
detect:
  any:
    - path: '%LOCALAPPDATA%\Microsoft\PowerToys'
before:
  # PowerToys has its own backup of its settings (shortcuts, FancyZones
  # layouts, Keyboard Manager remaps): better than copying its folder,
  # which also holds logs and caches.
  - type: manual
    text:
      en: >-
        In PowerToys, open Settings, General, the backup and restore section,
        and make a backup. It goes to Documents\PowerToys\Backup unless you
        chose another folder, and Documents travels with your files.
      fr: >-
        Dans PowerToys, ouvrez Paramètres, Général, la section de sauvegarde
        et de restauration, et faites une sauvegarde. Elle va dans
        Documents\PowerToys\Backup sauf si vous avez choisi un autre dossier,
        et Documents part avec vos fichiers.
after:
  - type: install
    winget: Microsoft.PowerToys
  - type: manual
    text:
      en: >-
        In PowerToys, open Settings, General, the backup and restore section,
        choose the folder that holds the backup, and restore it.
      fr: >-
        Dans PowerToys, ouvrez Paramètres, Général, la section de sauvegarde
        et de restauration, choisissez le dossier qui contient la sauvegarde,
        et restaurez-la.
