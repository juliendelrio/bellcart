# yaml-language-server: $schema=../../../schemas/recipe.schema.json
id: microsoft-powertoys
name: Microsoft PowerToys
detect:
  any:
    - path: '%LOCALAPPDATA%\Microsoft\PowerToys'
before:
  # PowerToys has its own backup of its settings (shortcuts, FancyZones
  # layouts, Keyboard Manager remaps): better than copying its folder,
  # which also holds logs and caches.
  - type: manual
    text:
      en: >-
        In PowerToys, open Settings, General, "Backup & restore", and click
        "Back up". Note the folder it shows, and keep the backup with your
        files.
      fr: >-
        Dans PowerToys, ouvrez Paramètres, Général, « Sauvegarde et
        restauration », et cliquez sur « Sauvegarder ». Notez le dossier
        indiqué et gardez la sauvegarde avec vos fichiers.
after:
  - type: install
    winget: Microsoft.PowerToys
  - type: manual
    text:
      en: >-
        In PowerToys, open Settings, General, "Backup & restore", choose the
        folder where you put the backup, and click "Restore".
      fr: >-
        Dans PowerToys, ouvrez Paramètres, Général, « Sauvegarde et
        restauration », choisissez le dossier où vous avez mis la sauvegarde,
        et cliquez sur « Restaurer ».
