# yaml-language-server: $schema=../../../schemas/recipe.schema.json
id: mozilla-firefox
name: Mozilla Firefox
detect:
  any:
    - path: '%APPDATA%\Mozilla\Firefox\Profiles'
before:
  - type: manual
    text:
      en: Close Firefox before the copy, so the profile is in a consistent state.
      fr: Fermez Firefox avant la copie, pour que le profil soit dans un état cohérent.
  # Unlike Chrome, a Firefox profile is portable: bookmarks, history and
  # saved passwords travel with the folder.
  - type: copy
    path: '%APPDATA%\Mozilla\Firefox'
    note:
      en: Profiles, with bookmarks, history and saved passwords.
      fr: Profils, avec favoris, historique et mots de passe enregistrés.
after:
  - type: install
    winget: Mozilla.Firefox
  - type: manual
    text:
      en: >-
        With Firefox closed, put the copied folder back in
        %APPDATA%\Mozilla\Firefox, then start Firefox.
      fr: >-
        Firefox étant fermé, replacez le dossier copié dans
        %APPDATA%\Mozilla\Firefox, puis lancez Firefox.
  # Since Firefox 67 the default profile is tied to where the program is
  # installed: a new path opens a new, empty profile.
  - type: manual
    text:
      en: >-
        If Firefox opens empty, your data is not lost: close it, start
        "firefox.exe -P" (Win+R), choose your old profile in the Profile
        Manager and tick "Use the selected profile without asking".
      fr: >-
        Si Firefox s'ouvre vide, vos données ne sont pas perdues : fermez-le,
        lancez « firefox.exe -P » (Win+R), choisissez votre ancien profil
        dans le gestionnaire de profils et cochez « Utiliser le profil
        sélectionné sans demander au démarrage ».
