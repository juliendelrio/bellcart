# yaml-language-server: $schema=../../../schemas/recipe.schema.json
id: mozilla-thunderbird
name: Mozilla Thunderbird
detect:
  any:
    - path: '%APPDATA%\Thunderbird\Profiles'
before:
  - type: manual
    text:
      en: Close Thunderbird before the copy, so the profile is in a consistent state.
      fr: Fermez Thunderbird avant la copie, pour que le profil soit dans un état cohérent.
  # Like Firefox, the profile is portable. It may hold the only copy of
  # mail: local folders and POP accounts are not on any server.
  - type: copy
    path: '%APPDATA%\Thunderbird'
    note:
      en: Profiles, with mail kept on this PC, address books, accounts and filters.
      fr: Profils, avec le courrier gardé sur ce PC, les carnets d'adresses, les comptes et les filtres.
  - type: manual
    text:
      en: >-
        If you once moved a profile or the local folders elsewhere (Account
        Settings, Local Folders, "Local directory"), copy that folder too.
      fr: >-
        Si vous avez un jour déplacé un profil ou les dossiers locaux ailleurs
        (Paramètres des comptes, Dossiers locaux, « Répertoire local »),
        copiez aussi ce dossier.
after:
  - type: install
    winget: Mozilla.Thunderbird
  - type: manual
    text:
      en: >-
        With Thunderbird closed, put the copied folder back in
        %APPDATA%\Thunderbird, then start Thunderbird.
      fr: >-
        Thunderbird étant fermé, replacez le dossier copié dans
        %APPDATA%\Thunderbird, puis lancez Thunderbird.
  # Since Thunderbird 68 the default profile is tied to where the program
  # is installed: a new path opens a new, empty profile.
  - type: manual
    text:
      en: >-
        If Thunderbird opens empty, your mail is not lost: close it, start
        "thunderbird.exe -P" (Win+R), choose your old profile in the Profile
        Manager and tick "Use the selected profile without asking".
      fr: >-
        Si Thunderbird s'ouvre vide, votre courrier n'est pas perdu : fermez-le,
        lancez « thunderbird.exe -P » (Win+R), choisissez votre ancien profil
        dans le gestionnaire de profils et cochez « Utiliser le profil
        sélectionné sans demander au démarrage ».
