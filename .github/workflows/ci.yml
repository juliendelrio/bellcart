name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Follow the naming convention in CONTRIBUTING.md
        env:
          # Passed through the environment, never interpolated in the
          # script: a branch name is untrusted input.
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|pack|i18n|docs|ci|chore)/([0-9]+-)?[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH" =~ $pattern ]]; then
            echo "::error::Branch '$BRANCH' does not match <type>/<issue>-<short-description>. See CONTRIBUTING.md."
            exit 1
          fi

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows Server 2022 and 2025 share their code base with
        # Windows 10 and Windows 11. Linux keeps the engine portable.
        os: [windows-2022, windows-2025, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
